server {
    listen       80;
    server_name  _;

    rewrite_log on;
    log_subrequest on;
    access_log  /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;
    root   /usr/share/docroot;
    client_max_body_size 8129M;
    proxy_read_timeout 1800;

    resolver 127.0.0.11 valid=30s;
    gzip on;
    gzip_types text/plain application/xml application/javascript application/json text/css application/octet-stream;
    # Drop obviously bad requests.
    location ~ \.(aspx|php|jsp|cgi)$ {
        return 410;
    }

    location / {
        index  index.html index.htm;
    }

    location ~ ^/api/builder/(.*)$ {
        set $builder builder;
        proxy_set_header Host $http_host;
        proxy_pass http://$builder:8080/api/$1$is_args$args;
        proxy_set_header Referer "";
        client_max_body_size 8192M;
    }

    location /api/tar {
        proxy_set_header Host $http_host;
        proxy_pass http://node:8080/api/tar;
        proxy_redirect http://node:8080/api/tar /api/tar;
        proxy_set_header Referer "";
        client_max_body_size 8192M;
    }

    # Simplified single reverse proxy
    location /api {
        proxy_set_header Host $http_host;
        proxy_pass http://node:8080/api;
        proxy_redirect http://node:8080/api /api;
        proxy_set_header Referer "";
        client_max_body_size 8192M;
    }

    # Single reverse proxy for seaview
    location /seaview/ {
        proxy_set_header Host $http_host;
        proxy_pass http://node:8080/seaview/;
        proxy_redirect http://node:8080/seaview/ /seaview/;
        proxy_set_header Referer "";
        client_max_body_size 1M;
    }

    # Simplified single reverse proxy

    location /NGCHM/ZipAppDownload {
        alias /NGCHM/standalone/ngChmApp.html;
        add_header Content-Disposition 'attachment; filename="ngChmApp.html"';
        add_header Content-Type: 'text/html';
        error_page 405 =200 $uri;
    }

    location /NGCHM/ShaidyMapGen.jar {
        alias /NGCHM/shaidymapgen/ShaidyMapGen.jar;
        add_header Content-Disposition 'attachment; filename="ShaidyMapGen.jar"';
        add_header Content-Type: 'application/java-archive';
        error_page 405 =200 $uri;
    }

    # Simplified single reverse proxy		### Questionable...  Is this ever used?
    location /NGCHM/api {
        proxy_set_header Host $http_host;
        proxy_pass http://node:8080/api;
        proxy_redirect http://node:8080/api /api;
        proxy_set_header Referer "";
        client_max_body_size 1M;
    }

    # Override location of NGCHM api endpoint.	### This no longer gets requested by server.app version ###
    #location /NGCHM/javascript/Config.js {
    #    alias   /usr/share/docroot/customapi/Config.js;
    #}

    location /NGCHM/javascript/custom {
        alias	/usr/share/docroot/customapi;
    }

    location /NGCHM/chm.html {
        alias   /usr/share/docroot/chm.html;
    }

    location /NGCHM {
        alias   /NGCHM/server.app;
    }

    location /favicon.ico {
        alias /NGCHM/viewer/ngChmIcon.ico;
    }

    location /seaview-themes/ {
        alias   /NGCHM/seaview-themes/;
    }

    location /standalone {
        alias   /NGCHM/standalone;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}
