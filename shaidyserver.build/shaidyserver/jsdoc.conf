{
    "tags": {
        "allowUnknownTags": true,
        "dictionaries": ["jsdoc","closure"]
    },
    "source": {
        "include": [ "." ],
        "exclude": [ "node_modules" ],
        "includePattern": ".+\\.js(doc|x)?$",
        "excludePattern": "(^|\\/|\\\\)_"
    },
    "plugins": [ "plugins/markdown", "./node_modules/jsdoc-route-plugin" ],
    "templates": {
        "cleverLinks": false,
        "monospaceLinks": false,
        "theme": "yeti",
        "systemName": "Shaidy Server",
        "footer": "",
        "copyright": "Shaidy Server. Copyright 2016-2025 The University of Texas MD Anderson Cancer Center."
    },
    "opts": {
      "template": "./node_modules/ink-docstrap/template/",
      "readme": "./jsdoc-readme.md",
      "recurse": true
    }
}
